<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}{{ school_name }} information and ASSMS portal{% endblock %}">
    <title>{% block title %}{{ school_name }}{% endblock %} - {{ app_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/aylota-logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="public-site">
    <header class="public-header">
        <nav class="navbar navbar-expand-lg public-navbar" aria-label="Main navigation">
            <div class="container">
                <a class="navbar-brand public-brand" href="{{ url_for('index') }}">
                    <img src="{{ url_for('static', filename='images/aylota-logo.png') }}" alt="">
                    <span>{{ school_name }}</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#publicNavigation" aria-controls="publicNavigation"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="publicNavigation">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('public_about') }}">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('public_admissions') }}">Admissions</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('public_academics') }}">Academics</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('public_news') }}">News</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('public_contact') }}">Contact</a></li>
                        <li class="nav-item ms-lg-2">
                            <a class="btn btn-primary public-login-link" href="{{ url_for('login') }}">
                                <i class="fas fa-right-to-bracket me-1" aria-hidden="true"></i> Login
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="mainContent">
        {% block content %}{% endblock %}
    </main>

    <footer class="public-footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
            <span>{{ school_name }} · {{ app_name }}</span>
            <span>&copy; {{ current_year }}</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
